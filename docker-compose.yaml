name: game
services:
  db:
    build: ./db
    container_name: db
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data   # = PGDATA dans db/Dockerfile
    networks:
      - app
    restart: always

  backend:                                 # nom imposé : nginx.conf pointe sur backend:3000
    build: ./backend
    container_name: backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    volumes:
      - uploads_data:/app/uploads          # Persistance des avatars uploadés
    depends_on:
      db:
        condition: service_healthy         # attend le HEALTHCHECK (pg_isready) de la DB
    networks:
      - app
    restart: always

  rev-proxy:
    build:
      context: .
      dockerfile: rev-proxy/Dockerfile
    container_name: rev-proxy
    depends_on:
      - backend
    ports:
      - "1025:80"
      - "1026:443"
    networks:
      - app
    restart: always

# Volumes nommés : gérés par Docker
volumes:
  db_data:
  uploads_data:

# Réseau bridge commun : les services se joignent par leur nom (db, backend…) comme un DNS
networks:
  app:
