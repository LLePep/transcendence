services:
  postgres:
    image: postgres:16-alpine
    container_name: transcendence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcendence_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-transcendence_user}:${POSTGRES_PASSWORD:-transcendence_secure_password}@postgres:5432/${POSTGRES_DB:-transcendence_db}?schema=public
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence_net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    depends_on:
      - backend
    networks:
      - transcendence_net

networks:
  transcendence_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
